name = "kite-server"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "kite-server"
database_id = "a4dca6ca-7399-46dc-822f-d05db937713f"   # wrangler d1 create kite-server 后替换

[[kv_namespaces]]
binding = "RATE"
id = "4a623fb9fb614b76a6f36f66e06cf8a8"                 # wrangler kv namespace create RATE 后替换

[triggers]
crons = ["0 4 * * *"]

[vars]
KITE_REGISTRATION = "open"
KITE_FEATURE_GATING = "off"
KITE_REGISTER_LIMIT = "5"
S3_ENDPOINT = "https://cfaf6bf9c9f639a960ac3be2d7f31418.r2.cloudflarestorage.com"
S3_BUCKET = "kite-sync"
S3_REGION = "auto"
S3_PREFIX = "kiteterm"
S3_ACCESS_KEY = "5a98a8131ae904e64459a27c596bc6d8"
S3_SECRET_KEY = "1f3bad07a4e9601d56c01f49fe1d3c4945b356d296456a7b2c368ab2769b99d9"
S3_PATH_STYLE = "on"
KITE_STS = "auto"
KITE_ADMIN_KEY = "16s4XqkNgqI2JHxazxfckbywNhiMGyFfBjttCEpuF7s="
R2_ACCOUNT_ID = ""
KITE_SMTP_FROM = ""
