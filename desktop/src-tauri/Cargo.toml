[package]
name = "kite-term"
version = "0.1.0"
description = "KiteTerm — personal SSH terminal with SFTP, key management and E2E-encrypted sync"
authors = ["Lin"]
edition = "2021"

[lib]
name = "kite_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# WKWebView 不实现 JS 的 alert/confirm 面板(wry 的 UIDelegate 只做了文件选择等三项),
# window.confirm 会不弹窗直接返回 false。确认框一律走这个插件的原生对话框。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = "0.63"
russh-sftp = "2"
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
chrono = "0.4"
dirs = "6"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
http = "0.2"
sha2 = "0.10"
bip39 = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# 仅 macOS 钥匙串与 Windows 凭据管理器(APP 只发布这两个平台)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
zeroize = "1"
whoami = "1"
# 本地终端的伪终端(macOS openpty / Windows ConPTY)
portable-pty = "0.9"
# ACME 证书签发
instant-acme = "0.8"
rcgen = "0.14"
x509-parser = "0.18"
# ACME 吊销需要把证书构造成 CertificateDer(与 instant-acme 同源)
rustls-pki-types = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
