[package]
name = "kite-term"
version = "0.1.0"
description = "KiteTerm — personal SSH terminal with SFTP, key management and E2E-encrypted sync"
authors = ["Lin"]
edition = "2021"

[lib]
name = "kite_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.63"
russh-sftp = "2"
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
chrono = "0.4"
dirs = "6"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
http = "0.2"
sha2 = "0.10"
bip39 = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 仅 macOS 钥匙串与 Windows 凭据管理器(APP 只发布这两个平台)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
zeroize = "1"
whoami = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
